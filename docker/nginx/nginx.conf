# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

#user docker_user;
worker_processes auto;
error_log /usr/local/nginx/logs/error.log;
pid /usr/local/nginx/logs/nginx.pid;

# Load dynamic modules. See /usr/share/nginx/README.dynamic.
#include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log off;
    #access_log  /usr/local/nginx/logs/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    
    gzip              on;
    gzip_comp_level   2;
    gzip_http_version 1.1;
    gzip_proxied      any;
    gzip_min_length   1000;
    gzip_disable      "MSIE [1-6]\.";
    gzip_types        text/plain 
                      text/xml 
                      text/css
                      text/comma-separated-values
                      text/javascript
                      application/javascript
                      application/json
                      application/x-javascript
                      application/atom+xml;

    # include             /usr/local/nginx/conf/mime.types;
    include           /etc/nginx/mime.types;
    default_type        application/octet-stream;
    
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=one:10m max_size=10g inactive=10m use_temp_path=off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;
        root         /usr/local/nginx/html;
        keepalive_timeout   70;

        # Let's Encrypt ACME challenge — must be served over plain HTTP, not redirected.
        # certbot writes tokens here; Let's Encrypt fetches them to validate domain ownership.
        location /.well-known/acme-challenge/ {
            root /var/www/acme-challenge;
            try_files $uri =404;
        }

        include /etc/nginx/locations.conf;
    }

    # Settings for a TLS enabled server.
    server {
        listen       443 ssl http2 default_server;
        listen       [::]:443 ssl http2 default_server;
        server_name  _;
        root         /usr/local/nginx/html;
        keepalive_timeout   70;

        ssl_certificate "/usr/local/nginx/private/cert/server.crt";
        ssl_certificate_key "/usr/local/nginx/private/cert/server.key";
        ssl_session_timeout  10m;
        ssl_ciphers ALL:!aNULL:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

        include /etc/nginx/locations.conf;
    }

}
