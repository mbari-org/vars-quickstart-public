        location / {
            root         /usr/local/nginx/html;
            autoindex off;
            autoindex_exact_size off;

            # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
            proxy_http_version 1.1;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;

            # Remove the Connection header if the client sends it,
            # it could be "close" to close a keepalive connection
            proxy_set_header Connection "";
        }

        location /framegrabs/ {
            alias         /usr/local/nginx/framegrabs/;
            autoindex on;
            autoindex_exact_size off;
        }

        location /media/ {
            alias         /usr/local/nginx/media/;
            autoindex on;
            autoindex_exact_size off;

            mp4;
            mp4_buffer_size 1M;
            mp4_max_buffer_size 5M;
            aio on;
            directio 8m;
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=31536000";
        }

        # === Vue 3 app under /query/ ==============================
        location /query/ {
            root /usr/local/nginx/html;

            # Serve static files if present, otherwise fall back to SPA entry
            try_files $uri $uri/ /query/index.html;

            # Optional: Cache static assets aggressively
            location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
